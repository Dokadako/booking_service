spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:1h}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
